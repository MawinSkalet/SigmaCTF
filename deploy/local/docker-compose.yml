name: sigmactf
x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL:-postgres://sigma:${POSTGRES_PASSWORD:?Run scripts/init-local.py}@postgres:5432/sigma}
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?Run scripts/init-local.py}
  FLAG_SECRET: ${FLAG_SECRET:?Run scripts/init-local.py}
  DOCKER_URL: http://socket-write:2375
  APP_ORIGIN: ${APP_ORIGIN:-http://ctf.localhost:8080}
  CHALLENGE_DOMAIN: ${CHALLENGE_DOMAIN:-localhost}
  PUBLIC_WEB_PORT: ${PUBLIC_WEB_PORT:-8080}
  PUBLIC_HTTPS: ${PUBLIC_HTTPS:-false}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TCP_HOST: ${TCP_HOST:-localhost}
  MAX_INSTANCES: ${MAX_INSTANCES:-10}
  IMAGE_PREFIX: ${IMAGE_PREFIX:-sigmactf}
  IMAGE_TAG: ${IMAGE_TAG:-v1}
  SANDBOX_FIREWALL_CONFIRMED: ${SANDBOX_FIREWALL_CONFIRMED:-false}
  ADMIN_HANDLE: ${ADMIN_HANDLE:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
services:
  traefik:
    image: traefik:v3.6
    container_name: sigmactf-traefik
    restart: unless-stopped
    command: [--configFile=/etc/traefik/traefik.yml]
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PUBLIC_WEB_PORT:-8080}:80'
      - '${TCP_BIND_ADDRESS:-127.0.0.1}:30000-30050:30000-30050'
    volumes:
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
    networks: [edge, socket-read]
    depends_on: [socket-read]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
  socket-read:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      EVENTS: 1
      VERSION: 1
      PING: 1
      POST: 0
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
    networks: [socket-read]
  socket-write:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 1
      EVENTS: 0
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
      BUILD: 0
      SYSTEM: 0
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
    networks: [socket-write]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigma
      POSTGRES_DB: sigma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-local.py}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sigma -d sigma']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, noeviction, --appendonly, 'yes']
    volumes: [redis-data:/data]
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: ${IMAGE_PREFIX:-sigmactf}/backend:${IMAGE_TAG:-v1}
    build: {context: ../.., dockerfile: apps/api/Dockerfile}
    restart: unless-stopped
    environment: *api-env
    networks: [edge, data, socket-write]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      socket-write: {condition: service_started}
    labels:
      traefik.enable: 'true'
      traefik.docker.network: sigmactf-edge
      traefik.http.routers.api.rule: '(Host(`${APP_HOST:-ctf.localhost}`) || Host(`localhost`) || Host(`127.0.0.1`)) && PathPrefix(`/api`)'
      traefik.http.routers.api.entrypoints: web
      traefik.http.services.api.loadbalancer.server.port: '4000'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
  janitor:
    image: ${IMAGE_PREFIX:-sigmactf}/backend:${IMAGE_TAG:-v1}
    pull_policy: never
    restart: unless-stopped
    environment:
      <<: *api-env
      ROLE: janitor
    networks: [edge, data, socket-write]
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
  web:
    image: ${IMAGE_PREFIX:-sigmactf}/web:${IMAGE_TAG:-v1}
    build: {context: ../.., dockerfile: apps/web/Dockerfile}
    restart: unless-stopped
    networks: [edge]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: sigmactf-edge
      traefik.http.routers.web.rule: 'Host(`${APP_HOST:-ctf.localhost}`) || Host(`localhost`) || Host(`127.0.0.1`)'
      traefik.http.routers.web.entrypoints: web
      traefik.http.services.web.loadbalancer.server.port: '3000'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
networks:
  edge: {name: sigmactf-edge}
  data: {internal: true}
  socket-read: {internal: true}
  socket-write: {internal: true}
volumes:
  postgres-data:
  redis-data:
