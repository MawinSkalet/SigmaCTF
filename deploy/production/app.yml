services:
  api:
    image: ${IMAGE_PREFIX:?}/backend:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:?}
    environment:
      IMAGE_PREFIX: ${IMAGE_PREFIX:?}
      IMAGE_TAG: ${IMAGE_TAG:?}
    networks:
      edge: {aliases: ['api-${SLOT:?}']}
      data: {}
      socket-write: {}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    image: ${IMAGE_PREFIX:?}/web:${IMAGE_TAG:?}
    restart: unless-stopped
    networks:
      edge: {aliases: ['web-${SLOT:?}']}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  janitor:
    image: ${IMAGE_PREFIX:?}/backend:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:?}
    environment:
      ROLE: janitor
      IMAGE_PREFIX: ${IMAGE_PREFIX:?}
      IMAGE_TAG: ${IMAGE_TAG:?}
    networks: [edge, data, socket-write]
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
networks:
  edge: {external: true, name: sigmactf-edge}
  data: {external: true, name: sigmactf_data}
  socket-write: {external: true, name: sigmactf_socket-write}
